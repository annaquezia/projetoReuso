<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head(${titulo})}"></head>
    <body>
        <header th:replace="~{fragments/layout :: nav}"></header>
        <main class="app-content form-page">
            <a class="back-link" th:href="@{/centro-academico/comunicados}"><svg th:replace="~{fragments/layout :: icon('arrow-left')}"></svg> Voltar aos comunicados</a>
            <div class="form-heading">
                <span class="eyebrow">COMUNICAÇÃO DOS EVENTOS</span>
                <h1 th:text="${titulo}"></h1>
                <p>A mensagem ficará visível nos detalhes do evento selecionado.</p>
            </div>
            <form class="data-form" th:action="@{${acao}}" th:object="${form}" method="post">
                <div class="alert alert-error" role="alert" th:if="${#fields.hasGlobalErrors()}">
                    <p th:each="erro : ${#fields.globalErrors()}" th:text="${erro}"></p>
                </div>
                <section class="form-section">
                    <h2>Informações do comunicado</h2>
                    <div class="form-grid">
                        <label class="span-2">
                            Evento
                            <select th:field="*{eventoId}" required>
                                <option value="">Selecione um evento</option>
                                <option th:each="opcao : ${eventos}" th:value="${opcao.id}" th:text="${opcao.nome}"></option>
                            </select>
                            <small class="field-error" th:errors="*{eventoId}"></small>
                        </label>
                        <label class="span-2">
                            Título
                            <input th:field="*{titulo}" maxlength="160" placeholder="Ex.: Orientações para o encontro" required>
                            <small class="field-error" th:errors="*{titulo}"></small>
                        </label>
                        <label class="span-2">
                            Mensagem<textarea th:field="*{mensagem}" rows="5" maxlength="2000" required></textarea>
                            <small class="field-error" th:errors="*{mensagem}"></small>
                        </label>
                    </div>
                </section>
                <div class="form-actions">
                    <a class="button button-outline" th:href="@{/centro-academico/comunicados}">Cancelar</a>
                    <button class="button button-primary" type="submit">
                        Salvar comunicado<span aria-hidden="true"><svg th:replace="~{fragments/layout :: icon('arrow-right')}"></svg></span>
                    </button>
                </div>
            </form>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </body>
</html>
