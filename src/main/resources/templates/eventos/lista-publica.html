<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head('Eventos')}"></head>
    <body>
        <header th:replace="~{fragments/layout :: nav}"></header>
        <main class="app-content page-content">
            <div class="page-intro">
                <span class="eyebrow">POLIWEEK · PROGRAMAÇÃO</span>
                <h1>Eventos</h1>
                <p>Encontre palestras, oficinas e encontros da semana acadêmica.</p>
            </div>
            <form class="filter-bar" method="get" th:action="@{/eventos}">
                <label for="status">Filtrar eventos</label>
                <select id="status" name="status">
                    <option value="">Todos os eventos</option>
                    <option th:each="option : ${statusOptions}" th:value="${option}" th:text="${#strings.capitalize(#strings.toLowerCase(#strings.replace(option.name(), '_', ' ')))}" th:selected="${statusSelecionado == option}">
                    </option>
                </select>
                <button class="button button-small button-outline" type="submit">Aplicar</button>
            </form>
            <div class="event-grid" th:if="${!#lists.isEmpty(eventos)}">
                <article class="event-card" th:each="evento : ${eventos}">
                    <div class="event-visual">
                        <img class="event-image" th:if="${evento.imagemUrl != null and !#strings.isEmpty(evento.imagemUrl)}" th:src="${evento.imagemUrl}" alt=""><span class="event-date" th:text="${#temporals.format(evento.data, 'dd MMM')}">10 OUT</span><span class="visual-glyph" aria-hidden="true"><svg th:replace="~{fragments/layout :: icon('calendar-event')}"></svg></span><span class="event-category" th:text="${evento.status}">DISPONÍVEL</span>
                    </div>
                    <div class="event-card-body">
                        <span class="event-meta" th:text="${#temporals.format(evento.horario, 'HH:mm')} + ' · ' + ${evento.local}">14:00 · Auditório</span>
                        <h2 th:text="${evento.nome}">Título do evento</h2>
                        <p th:text="${evento.descricao}">Descrição breve.</p>
                        <a class="card-link" th:href="@{/eventos/{id}(id=${evento.id})}">Ver mais <span><svg th:replace="~{fragments/layout :: icon('arrow-right')}"></svg></span></a>
                    </div>
                </article>
            </div>
            <div class="empty-state" th:if="${#lists.isEmpty(eventos)}">
                <h2>Nenhum evento encontrado</h2>
                <p>Tente outro filtro ou volte em breve para conferir a programação.</p>
                <a class="button button-outline" th:href="@{/eventos}">Limpar filtro</a>
            </div>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </body>
</html>
