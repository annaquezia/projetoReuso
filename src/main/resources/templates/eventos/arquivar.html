<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Arquivar evento')}"></head>
<body><header th:replace="~{fragments/layout :: nav}"></header>
<main class="app-content form-page">
<a class="back-link" th:href="@{/centro-academico/eventos}">← Voltar</a>
<div class="form-heading"><h1>Arquivar evento</h1><p>Confira os dados antes de confirmar.</p></div>
<div th:if="${erro}" class="alert alert-error" th:text="${erro}"></div>
<section class="data-form"><div class="form-section"><h2 th:text="${evento.nome}">Registro</h2><p>O evento sairá da programação pública e da lista de eventos ativos. Seu registro será preservado no banco.</p>
<p th:if="${evento.ativo == false}">Este registro já está inativo.</p></div>
<form th:if="${evento.ativo}" th:action="@{/centro-academico/eventos/{id}/arquivar(id=${evento.id})}" method="post">
<div class="form-actions"><a class="button button-outline" th:href="@{/centro-academico/eventos}">Voltar sem alterar</a><button class="button button-primary" type="submit">Confirmar arquivamento</button></div>
</form></section>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
