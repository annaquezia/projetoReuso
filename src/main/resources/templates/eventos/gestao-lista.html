<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Gerenciar eventos')}"></head>
<body><header th:replace="~{fragments/layout :: nav}"></header><main class="app-content page-content">
    <div class="welcome-row"><div><span class="eyebrow">ÁREA DO CENTRO ACADÊMICO</span><h1>Seus eventos</h1><p class="muted">Crie e acompanhe os encontros da sua comunidade.</p></div><a class="button button-primary" th:href="@{/centro-academico/eventos/novo}"><span>＋</span> Novo evento</a></div>
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div><div th:if="${erro}" class="alert alert-error" th:text="${erro}"></div>
    <div class="table-wrap" th:if="${!#lists.isEmpty(eventos)}"><table><thead><tr><th>Evento</th><th>Data</th><th>Local</th><th>Status</th><th>Ações</th></tr></thead><tbody><tr th:each="evento : ${eventos}"><td><b th:text="${evento.nome}"></b><small class="table-sub" th:text="${evento.palestrante != null ? evento.palestrante.nome : 'Sem palestrante associado'}"></small></td><td th:text="${#temporals.format(evento.data, 'dd/MM/yyyy')} + ' · ' + ${#temporals.format(evento.horario, 'HH:mm')}"></td><td th:text="${evento.local}"></td><td><span class="status-pill" th:classappend="${' status-' + #strings.toLowerCase(evento.status.name())}" th:text="${evento.status}"></span></td><td><div class="table-actions"><a class="text-link" th:href="@{/centro-academico/eventos/{id}/editar(id=${evento.id})}">Editar</a><a class="text-link" th:href="@{/eventos/{id}(id=${evento.id})}">Ver</a><a class="text-link danger-link" th:href="@{/centro-academico/eventos/{id}/arquivar(id=${evento.id})}">Arquivar</a><form th:if="${evento.status.name() == 'DISPONIVEL'}" th:action="@{/centro-academico/eventos/{id}/lotar(id=${evento.id})}" method="post"><button class="link-button" type="submit">Marcar lotado</button></form><form th:if="${evento.status.name() == 'DISPONIVEL' or evento.status.name() == 'LOTADO'}" th:action="@{/centro-academico/eventos/{id}/cancelar(id=${evento.id})}" method="post" onsubmit="return confirm('Cancelar este evento?')"><button class="link-button danger-link" type="submit">Cancelar</button></form><form th:if="${evento.status.name() == 'DISPONIVEL' or evento.status.name() == 'LOTADO'}" th:action="@{/centro-academico/eventos/{id}/finalizar(id=${evento.id})}" method="post"><button class="link-button" type="submit">Finalizar</button></form></div></td></tr></tbody></table></div>
    <div class="empty-state" th:if="${#lists.isEmpty(eventos)}"><span class="empty-icon">✳</span><h2>Seu primeiro evento começa aqui</h2><p>Publique um evento e convide a comunidade para participar.</p><a class="button button-primary" th:href="@{/centro-academico/eventos/novo}">Criar evento <span>→</span></a></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
