<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Minhas inscrições')}"></head>
<body><header th:replace="~{fragments/layout :: nav}"></header><main class="app-content page-content">
<div class="welcome-row"><div><span class="eyebrow">PARTICIPAÇÃO NOS EVENTOS</span><h1>Minhas inscrições</h1><p>Acompanhe os eventos nos quais você se inscreveu.</p></div><a class="button button-primary" th:href="@{/eventos}">Explorar eventos</a></div>
<div th:if="${#lists.isEmpty(inscricoes)}" class="empty-state"><h2>Você ainda não se inscreveu em um evento</h2><p>Abra os detalhes de um evento e escolha Inscrever-me.</p></div>
<div th:if="${!#lists.isEmpty(inscricoes)}" class="table-wrap"><table class="responsive-table" role="table"><caption class="visually-hidden">Inscrições do estudante</caption><thead role="rowgroup"><tr role="row"><th>Evento</th><th>Data e horário</th><th>Local</th><th>Sua inscrição</th><th>Ações</th></tr></thead>
<tbody role="rowgroup"><tr role="row" th:each="inscricao : ${inscricoes}"><td role="cell" data-label="Evento"><b th:text="${inscricao.evento.nome}"></b><small class="table-sub" th:text="${!inscricao.evento.ativo ? 'Evento arquivado' : inscricao.evento.nomeEstado}"></small></td>
<td role="cell" data-label="Data e horário" th:text="${#temporals.format(inscricao.evento.data, 'dd/MM/yyyy')} + ' · ' + ${#temporals.format(inscricao.evento.horario, 'HH:mm')}"></td><td role="cell" data-label="Local" th:text="${inscricao.evento.local}"></td>
<td role="cell" data-label="Sua inscrição"><span class="status-pill" th:text="${inscricao.ativa ? 'Confirmada' : 'Cancelada'}"></span></td>
<td role="cell" data-label="Ações"><div class="table-actions"><a th:if="${inscricao.evento.ativo}" class="text-link" th:href="@{/eventos/{id}(id=${inscricao.evento.id})}">Ver evento</a>
<form th:if="${inscricao.ativa}" th:action="@{/minhas-inscricoes/{id}/cancelar(id=${inscricao.id})}" method="post" data-confirm="Cancelar sua inscrição?" data-confirm-description="Sua vaga será liberada para outro participante."><button class="link-button danger-link" type="submit">Cancelar inscrição</button></form></div></td></tr></tbody></table></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
