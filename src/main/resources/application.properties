spring.application.name=projeto-reuso
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/projetoreuso?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=lula1313
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.thymeleaf.cache=true
server.error.whitelabel.enabled=false
logging.level.br.edu.projetoreuso=INFO

# Variantes: catálogo com inscrições (padrão) ou somente divulgação.
app.inscricoes.habilitadas=${APP_INSCRICOES_HABILITADAS:true}
