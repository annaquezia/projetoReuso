# Banco em memória para demonstração local quando não houver MySQL instalado.
# Os dados são apagados quando a aplicação é encerrada.
spring.datasource.url=jdbc:h2:mem:projetoreuso;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
server.address=127.0.0.1
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.thymeleaf.cache=false

# Contas e eventos fictícios criados a cada inicialização do modo demo.
app.demo.seed=true
